version: 2

updates:
  # The build toolchain: mermaid-cli, puppeteer, html-validate. All devDependencies,
  # but they execute in CI against repository content, so a compromised one runs code.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      build-toolchain:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # Actions are pinned to commit SHAs, which is what stops a tag repoint from
  # changing what runs. The cost of SHA pinning is that nothing tells you an
  # update exists; Dependabot is what closes that gap, and it rewrites the SHA
  # and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
