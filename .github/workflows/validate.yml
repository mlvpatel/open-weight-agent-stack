name: validate
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly scheduled link check
permissions: { contents: read }
jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: install pinned toolchain
        run: npm ci --no-audit --no-fund
      - name: extract diagrams from MANUAL.md
        run: python3 scripts/extract_diagrams.py
      - name: sources match the manual
        run: |
          if ! git diff --quiet -- diagrams/src; then
            echo "::error::diagrams/src is stale. Run scripts/extract_diagrams.py and commit."
            git diff --stat -- diagrams/src
            exit 1
          fi
      - name: render twice and require identical bytes
        run: |
          bash scripts/render_diagrams.sh
          cp -r diagrams/svg /tmp/render-a
          rm -rf diagrams/svg
          bash scripts/render_diagrams.sh
          diff -rq /tmp/render-a diagrams/svg
          echo "rendering is reproducible in this environment"
      - name: publish rendered diagrams
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagrams-svg
          path: diagrams/svg/
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: check every external link
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-concurrency 8 --accept 200,201,202,204,206,301,302,308,403,429 MANUAL.md README.md docs/
          fail: true
