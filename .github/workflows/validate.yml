name: validate
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly scheduled link check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: install pinned toolchain
        run: npm ci --no-audit --no-fund
      - name: extract diagrams from MANUAL.md
        run: python3 scripts/extract_diagrams.py
      - name: sources match the manual
        run: |
          if ! git diff --quiet -- diagrams/src; then
            echo "::error::diagrams/src is stale. Run scripts/extract_diagrams.py and commit."
            git diff --stat -- diagrams/src
            exit 1
          fi
      - name: render twice and require identical bytes
        run: |
          bash scripts/render_diagrams.sh
          cp -r diagrams/svg /tmp/render-a
          rm -rf diagrams/svg
          bash scripts/render_diagrams.sh
          diff -rq /tmp/render-a diagrams/svg
          echo "rendering is reproducible in this environment"
      - name: publish rendered diagrams
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagrams-svg
          path: diagrams/svg/

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: install pinned toolchain
        run: npm ci --no-audit --no-fund
      - name: the gate rejects malformed input
        run: |
          # a validator that passes on broken input proves nothing
          printf '<!DOCTYPE html><html lang="en"><head><title>t</title></head><body><table><tr><td>x</table></body></html>' > /tmp/broken.html
          if npx --no-install html-validate /tmp/broken.html; then
            echo "::error::HTML gate accepted a malformed document. It is not enforcing anything."
            exit 1
          fi
          echo "gate correctly rejects malformed HTML"

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: install pinned toolchain
        run: npm ci --no-audit --no-fund
      - name: vendored bundle matches the pinned mermaid release
        run: |
          src=node_modules/mermaid/dist/mermaid.min.js
          if [ ! -f "$src" ]; then
            echo "::error::$src is missing, so the vendored bundle cannot be verified."
            exit 1
          fi
          if ! cmp -s "$src" site/mermaid.min.js; then
            echo "::error::site/mermaid.min.js differs from the mermaid version in package-lock.json."
            echo "Refresh it with: cp $src site/mermaid.min.js"
            exit 1
          fi
          echo "vendored bundle matches mermaid $(node -p "require('./node_modules/mermaid/package.json').version")"

      - name: regenerate the site from MANUAL.md
        run: python3 scripts/build_site.py
      - name: committed site matches regeneration
        run: |
          if ! git diff --quiet -- site/index.html; then
            echo "::error::site/index.html is stale. Run scripts/build_site.py and commit."
            git diff --stat -- site/index.html
            exit 1
          fi
          echo "derived site matches its source"
      - name: generated document is valid HTML
        run: npx --no-install html-validate site/index.html

  invariants:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: renderer resists injection
        run: python3 scripts/test_render_security.py
      - name: watcher debounce behaves as documented
        run: python3 scripts/test_watch_upstream.py
      - name: internal anchors, relative links, and stated counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_invariants.py
      - name: the gate rejects a broken reference
        run: |
          # prove the checker is not vacuous before trusting a pass
          cp MANUAL.md /tmp/manual.bak
          python3 - <<'EOP'
          import pathlib
          p = pathlib.Path("MANUAL.md")
          p.write_text(p.read_text().replace("## 22. Task-to-model routing", "## 22. Renamed", 1))
          EOP
          if SKIP_REPO_DESCRIPTION=1 python3 scripts/check_invariants.py; then
            echo "::error::Invariant checker passed against a deliberately broken anchor."
            cp /tmp/manual.bak MANUAL.md
            exit 1
          fi
          cp /tmp/manual.bak MANUAL.md
          echo "checker correctly rejects a broken reference"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: check every external link
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 3
            --retry-wait-time 10
            --accept 200,201,202,204,206,301,302,308
            MANUAL.md README.md docs/
          fail: true
          # 403 and 429 are no longer accepted as success. A rate-limited or
          # forbidden response is not evidence that a page exists, and treating
          # it as success is how a link checker quietly stops checking.

  deploy:
    # Job-level condition, never a workflow-level path filter: a workflow skipped
    # by paths reports Pending forever and would block required checks, while a
    # job skipped by a conditional reports Success.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [diagrams, html, links, invariants, generated]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
